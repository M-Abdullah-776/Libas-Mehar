services:
  # Backend API Web Service
  - type: web
    name: libas-mehar-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: libas-mehar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: libas-mehar-frontend
          property: url

  # Frontend React SPA Static Site
  - type: web
    name: libas-mehar-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: libas-mehar-backend
          property: url
          append: /api

databases:
  # Free PostgreSQL Database
  - name: libas-mehar-db
    databaseName: anwar_clothing
    user: anwar_user
    plan: free
